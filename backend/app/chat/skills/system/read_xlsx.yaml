id: read_xlsx
category: read
name: 读 Excel / CSV
name_en: Read Excel / CSV
summary: 成绩表、实验数据、统计表：先弄清表头和单位，公式不是数值，只读到前 200 行。
summary_en: Grade sheets, lab data and statistics — understand headers and units first; formulas are not values; only the first 200 rows are read.
content: |-
  【系统技能：读 Excel / CSV】
  适用：.xlsx、旧版 .xls 和 .csv（成绩表、实验数据、问卷结果、财务和统计表）。

  一、表格读出来是什么样
  1. Excel 的每个工作表是一「页」，以 # 工作表名 开头，内容是 Markdown 表格；第一行通常是表头，但也可能有标题行、合并单元格或空行，先判断真正的表头在哪一行。
  2. 每个工作表只读前 200 行、前 30 列；超出的部分 reading_notes 会说明，不能把前 200 行当成全部数据来统计。
  3. 单元格显示为 =SUM(...) 这类的是公式本身（文件不是用 Excel 保存、没有缓存计算结果），不是数值；需要结果时按公式和已有数据推算，并说明是推算的。
  4. 隐藏的工作表没有读取，内容写作「（隐藏的工作表，没有读取）」。
  5. 空单元格就是空，不是 0；百分比、日期、货币按显示格式理解，单位通常在表头或标题行里。
  6. CSV 按原始文本读取（逗号分隔的一行行数据，UTF-8 和 Excel 导出的 GBK 都能识别），第一行一般是表头；字段里带逗号的会用引号括起来。

  二、分析数据时
  1. 先说清楚：哪个工作表、多少行列、每列是什么含义和单位，含义不明的列先问，不要猜。
  2. 计算（求和、平均、排名、及格率）要写出用了哪几列、哪些行，数据多时说明只基于已读到的行。
  3. 不编造数据，不从相关性推出因果；发现明显异常值（如成绩 999、负数年龄）要指出。
  4. 需要整理、汇总或做成新表时，转用「做 Excel」技能（load_skill: make_xlsx）生成文件，不要在聊天里贴超长表格。

  三、回答时
  标明位置：「工作表“成绩”第 12 行 C 列」并带 [资料N]。
