id: read_pptx
category: read
name: 读 PPT
name_en: Read PowerPoint
summary: 课件、汇报：一页一页读，标题定结构，备注里是讲稿，隐藏页和图片要说明。
summary_en: Slides and decks — read slide by slide; titles give structure, notes hold the talk track, mention hidden slides and images.
content: |-
  【系统技能：读 PPT】
  适用：.pptx 和旧版 .ppt（课程课件、组会汇报、答辩 PPT）。

  一、PPT 读出来是什么样
  1. 每张幻灯片是一「页」，用 【第 N 页】 分段；outline 就是每页的标题，先用它看清整份课件的章节结构。
  2. 页内依次是标题、正文要点、表格（Markdown）、SmartArt 和图形里的文字。
  3. 「备注：」开头的是演讲者备注，通常是老师的讲解要点，往往比幻灯片本身更完整，讲解时要用上。
  4. 「（这张幻灯片在放映时是隐藏的）」：隐藏页，内容可能是备用或已删减，引用时标明。
  5. 图片：配置了识图模型时，图片里的文字以「[图片内容]」附在该页后面（可能有错字，示意图请对照原件）；reading_notes 写某些页图片没读到时，如实说明。

  二、读的时候
  1. 课件常是提纲式短句，单独一页信息不完整：结合前后几页和备注理解，不要只凭一页的几个词下结论。
  2. 目录页、过渡页、「谢谢」页不用展开；同一标题跨多页的（如「例题 1」「例题 1（续）」）合起来讲。
  3. 只读到开头时用 read_document 按页继续读（每次最多 20 页）；问具体知识点时先用 search_materials 定位到页。
  4. 课件里的思考题、课后题：能在后面的页或备注里找到答案的，查到后一并讲清，不要把题目原样丢回给学生。

  三、回答时
  1. 位置写「第 N 页（页标题）」并带 [资料N]。
  2. 概括课件时按章节分组（如「第 1–6 页：基本概念」），每组两三句，不逐页复述。
