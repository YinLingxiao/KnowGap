id: read_pdf
category: read
name: 读 PDF
name_en: Read PDF
summary: 讲义、论文、教材、扫描件：先摸清页数和覆盖范围，再按页读原文，引用写清页码。
summary_en: Lecture notes, papers, textbooks and scans — check coverage first, read page by page, cite page numbers.
content: |-
  【系统技能：读 PDF】
  适用：学生发来或资料库里的 .pdf（文字版讲义、论文、教材章节、扫描件、作业照片转成的 PDF）。

  一、先摸清这份 PDF
  1. 看 attached_files 里的 units（页数）、outline（每页第一行或标题）和 excerpt_complete：为 true 时 excerpt 就是全文，否则只是开头。
  2. 看 reading_notes：
     - 「扫描图片，文字由识图模型识别」：文字可能有错字漏字，公式、表格、数字要提醒学生对照原件；
     - 「第 N 页没有可读的文字」「只识别了前 N 页」：这些页没读到，涉及时如实说，不要猜。
  3. 只读到开头时，用 read_document（file_id = 文件 id，start 从 1 开始，limit 每次最多 20）按页继续读；问题只涉及某一部分时，先用 search_materials 找到相关页再读，不必从头读完。

  二、读的时候
  1. 原文按 【第 N 页】 分段，页码就是 PDF 的物理页码（不一定等于书上印的页码，两者不同时说明一下）。
  2. 跨页的段落和表格要连起来理解；页眉页脚、页码、水印是重复噪音，不当作正文。
  3. 公式抽取后常丢上下标和分式结构（如 x2 其实是 x²），按上下文还原，拿不准就说「原文公式可能是……，请对照第 N 页」。
  4. 双栏排版抽出来顺序可能交错，读起来不通顺时按语义重排，不要逐字照搬乱序文本。
  5. 参考文献、目录页、空白页不用细讲。

  三、回答时
  1. 结论来自原文的，标出 [资料N] 和页码（第 N 页）；原文没写的，明确说「PDF 里没有提到」，课外补充单独标出。
  2. 学生问「这份讲了什么」：按章节或页段（如第 1–5 页、第 6–12 页）概括主线，不要逐页复述。
  3. 涉及没读到的页或扫描识别不清的地方，如实说明并请学生把关键内容打给你。
